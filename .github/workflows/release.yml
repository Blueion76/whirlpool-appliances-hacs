name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/whirlpool_appliances/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("custom_components/whirlpool_appliances/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          version = str(manifest.get("version") or "").strip()
          if not version:
              raise SystemExit('manifest.json "version" is empty')

          tag = f"v{version.lstrip('v')}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
          PY

      - name: Debug resolved version/tag
        run: |
          echo "version='${{ steps.manifest.outputs.version }}'"
          echo "tag='${{ steps.manifest.outputs.tag }}'"

      - name: Determine previous release tag
        id: prev_tag
        run: |
          set -euo pipefail

          current_tag='${{ steps.manifest.outputs.tag }}'
          previous_tag=$(
            git tag --list 'v*' --sort=-creatordate \
              | grep -vxF "$current_tag" \
              | head -n 1 \
              || true
          )

          echo "prev_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: '${previous_tag:-none}'"

      - name: Check whether tag already exists
        id: tag_exists
        run: |
          set -euo pipefail

          tag='${{ steps.manifest.outputs.tag }}'
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.tag_exists.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIOUS_TAG" ]; then
            range="HEAD"
            previous_label="initial release"
          else
            range="$PREVIOUS_TAG..HEAD"
            previous_label="$PREVIOUS_TAG"
          fi

          echo "Generating notes for range: $range"

          notes=$(
            git log "$range" --no-merges --pretty=format:'- %s (%h)' \
              | grep -Eiv '^(Revert|WIP|Merge)' \
              | grep -Eiv '\bthen reverted\b' \
              || true
          )

          if [ -z "$notes" ]; then
            notes="- No notable changes."
          fi

          {
            echo "Automated release for manifest version $VERSION"
            echo
            echo "Changes since $previous_label:"
            echo "$notes"
          } > release_notes.md

          cat release_notes.md

      - name: Create tag
        if: steps.tag_exists.outputs.exists != 'true'
        run: |
          set -euo pipefail

          git tag '${{ steps.manifest.outputs.tag }}'
          git push origin '${{ steps.manifest.outputs.tag }}'

      - name: Create GitHub Release
        if: steps.tag_exists.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create '${{ steps.manifest.outputs.tag }}' \
            --title '${{ steps.manifest.outputs.tag }}' \
            --notes-file release_notes.md
