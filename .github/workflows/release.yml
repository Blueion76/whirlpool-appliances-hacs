name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/whirlpool_appliances/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          manifest_path = Path("custom_components/whirlpool_appliances/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          version = (manifest.get("version") or "").strip()
          if not version:
            raise SystemExit('manifest.json "version" is empty')

          tag = f"v{version.lstrip('v')}"

          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as f:
            f.write(f"version={version}\n")
            f.write(f"tag={tag}\n")
          PY

      - name: Debug resolved version/tag
        run: |
          echo "version='${{ steps.manifest.outputs.version }}'"
          echo "tag='${{ steps.manifest.outputs.tag }}'"

      - name: Determine previous tag
        id: prev_tag
        run: |
          set -e
          # Most recent tag by creation date (exclude the tag we are about to create)
          prev=$(git tag --sort=-creatordate | grep -v "^${{ steps.manifest.outputs.tag }}$" | head -n 1 || true)
          echo "prev_tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous tag: '$prev'"

      - name: Generate release notes (commits since previous tag)
        id: notes
        run: |
          set -e
          prev="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$prev" ]; then
            range="HEAD"
          else
            range="$prev..HEAD"
          fi

          echo "Generating notes for range: $range"

          # Commit list; skip merges; filter noisy/revert commits including "then reverted"
          notes=$(git log "$range" --no-merges --pretty=format:'- %s (%h)' \
            | grep -Ev '(?i)^(Revert|WIP|Merge)' \
            | grep -Ev '(?i).*\bthen reverted\b.*' \
            || true)

          if [ -z "$notes" ]; then
            notes="- No notable changes."
          fi

          {
            echo "notes<<'EOF'"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag_exists
        run: |
          if git rev-parse "${{ steps.manifest.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag_exists.outputs.exists != 'true'
        run: |
          git tag "${{ steps.manifest.outputs.tag }}"
          git push origin "${{ steps.manifest.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag_exists.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$prev" ]; then prev="initial release"; fi

          gh release create "${{ steps.manifest.outputs.tag }}" \
            --title "${{ steps.manifest.outputs.tag }}" \
            --notes "Automated release for manifest version ${{ steps.manifest.outputs.version }}.

Changes since ${prev}:
${{ steps.notes.outputs.notes }}"
