name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff format (check)
        run: ruff format --check custom_components/whirlpool_appliances/config_flow.py
      - name: Ruff lint
        run: |
          ruff check \
            custom_components/whirlpool_appliances/__init__.py \
            custom_components/whirlpool_appliances/config_flow.py \
            custom_components/whirlpool_appliances/entity.py \
            custom_components/whirlpool_appliances/sensor.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
