name: Bug report
description: Report a problem with the Whirlpool Appliances integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach a diagnostics file if appliance support/entity state is involved.
    validations:
      required: false
