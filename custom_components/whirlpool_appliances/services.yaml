call_api:
  name: Call Whirlpool API
  description: Call a Whirlpool cloud API path discovered in the Android APK. Returns the decoded response.
  fields:
    method:
      required: false
      example: GET
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    path:
      required: true
      example: /api/v1/appliance/status/SAID_HERE
      selector:
        text:
    body:
      required: false
      selector:
        object:
    params:
      required: false
      selector:
        object:

send_appliance_command:
  name: Send appliance command
  description: Send a command through /api/v1/appliance/command.
  fields:
    said:
      required: true
      selector:
        text:
    command:
      required: false
      example: setAttributes
      selector:
        text:
    attributes:
      required: false
      selector:
        object:
    raw:
      required: false
      selector:
        object:

set_cavity_light:
  name: Set cavity light
  description: Wrapper around the APK-observed setCavityLight/cavityLight command.
  fields:
    said:
      required: true
      selector:
        text:
    on:
      required: true
      selector:
        boolean:
    cavity:
      required: false
      example: upper
      selector:
        text:

appliance_function:
  name: Appliance function
  description: Call one of the named appliance functions mapped in api_spec.py.
  fields:
    function:
      required: true
      selector:
        select:
          options:
            - get_status
            - sync
            - send_command
            - create_reminder
            - get_channel
            - get_favorites
            - get_favorites_v2
            - delete_favorite
            - get_ac_filter_status
            - reset_ac_filter
            - check_firmware
            - ota_descriptor_status
            - ota_status
            - esp
            - live_collect
            - manage_recipe
            - send_ioc_recipe
            - cook_recipe
    said:
      required: false
      selector:
        text:
    body:
      required: false
      selector:
        object:
    path_values:
      required: false
      selector:
        object:

refresh:
  name: Refresh Whirlpool data
  description: Refresh appliance list and status data now.

publish_thing_command:
  name: Publish ThingShield MQTT command
  description: Publish a command to a TS_SAID / ThingShield appliance over AWS IoT MQTT. Use getState for a safe status request; other command payloads should match app/APK payloads.
  fields:
    said:
      required: true
      selector:
        text:
    command:
      required: false
      default: getState
      example: getState
      selector:
        text:
    payload:
      required: false
      selector:
        object:

set_attributes:
  name: Set legacy appliance attributes
  description: Set raw legacy SAID attributes through /api/v1/appliance/command.
  fields:
    said:
      required: true
      selector:
        text:
    attributes:
      required: true
      selector:
        object:

set_oven_cook:
  name: Start oven cook cycle
  description: Start or modify a Whirlpool legacy oven cavity cook cycle. Temperatures are entered in Celsius to match Whirlpool cloud units.
  fields:
    said:
      required: true
      selector:
        text:
    temperature:
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: °C
    mode:
      required: false
      default: bake
      selector:
        select:
          options:
            - bake
            - convect_bake
            - convection_bake
            - broil
            - convect_broil
            - convection_broil
            - convect_roast
            - convection_roast
            - keep_warm
            - air_fry
    cavity:
      required: false
      default: upper
      selector:
        select:
          options:
            - upper
            - lower

stop_oven_cavity:
  name: Stop oven cavity
  description: Cancel a Whirlpool legacy oven cavity cook cycle.
  fields:
    said:
      required: true
      selector:
        text:
    cavity:
      required: false
      default: upper
      selector:
        select:
          options:
            - upper
            - lower

stop_microwave:
  name: Stop microwave
  description: Cancel a Whirlpool legacy microwave operation on combo oven/microwave appliances.
  fields:
    said:
      required: true
      selector:
        text:


sync_time:
  name: Sync appliance time
  description: Sync the current time and timezone to a legacy Whirlpool appliance using the APK DateTimeSet attributes. If timezone is omitted, the appliance's TimeZoneId/TimezoneId from raw status is used.
  fields:
    said:
      required: true
      selector:
        text:
    timezone:
      required: false
      example: America/Chicago
      selector:
        text:
