call_api:
  name: Call Whirlpool API
  description: Call a Whirlpool cloud API path discovered in the Android APK. Returns the decoded response.
  fields:
    method:
      required: false
      example: GET
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    path:
      required: true
      example: /api/v1/appliance/status/SAID_HERE
      selector:
        text:
    body:
      required: false
      selector:
        object:
    params:
      required: false
      selector:
        object:

send_appliance_command:
  name: Send appliance command
  description: Send a command through /api/v1/appliance/command.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    command:
      required: false
      example: setAttributes
      selector:
        text:
    attributes:
      required: false
      selector:
        object:
    raw:
      required: false
      selector:
        object:

set_cavity_light:
  name: Set cavity light
  description: Wrapper around the APK-observed setCavityLight/cavityLight command.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn this feature on or off.
      required: true
      selector:
        boolean:
    cavity:
      required: false
      example: upper
      selector:
        text:

appliance_function:
  name: Appliance function
  description: Call one of the named appliance functions mapped in api_spec.py.
  fields:
    function:
      required: true
      selector:
        select:
          options:
            - get_status
            - sync
            - send_command
            - create_reminder
            - get_channel
            - get_favorites
            - get_favorites_v2
            - delete_favorite
            - get_ac_filter_status
            - reset_ac_filter
            - check_firmware
            - ota_descriptor_status
            - ota_status
            - esp
            - live_collect
            - manage_recipe
            - send_ioc_recipe
            - cook_recipe
    said:
      required: false
      selector:
        text:
    body:
      required: false
      selector:
        object:
    path_values:
      required: false
      selector:
        object:

refresh:
  name: Refresh Whirlpool data
  description: Refresh appliance list and status data now.

publish_thing_command:
  name: Publish ThingShield MQTT command
  description: Publish a command to a TS_SAID / ThingShield appliance over AWS IoT MQTT. Use getState for a safe status request; other command payloads should match app/APK payloads.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    command:
      required: false
      default: getState
      example: getState
      selector:
        text:
    payload:
      required: false
      selector:
        object:

set_attributes:
  name: Set legacy appliance attributes
  description: Set raw legacy SAID attributes through /api/v1/appliance/command.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    attributes:
      required: true
      selector:
        object:

set_oven_cook:
  name: Start oven cook cycle
  description: Start or modify a Whirlpool legacy oven cavity cook cycle. Temperature is Celsius. Optional cook time, delay time, and complete action are DDM-backed.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance device is selected.
      required: false
      selector:
        text:
    temperature:
      name: Temperature
      description: Target temperature in Celsius.
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: °C
    mode:
      name: Mode
      required: false
      default: bake
      selector:
        select:
          options:
            - bake
            - broil
            - keep_warm
    cook_time_minutes:
      name: Cook time
      description: Optional oven cook time in minutes.
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    delay_time_minutes:
      name: Delay time
      description: Optional delay start time in minutes.
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    complete_action:
      name: Complete action
      description: What the oven should do when cook time completes.
      required: false
      default: turn_off
      selector:
        select:
          options:
            - turn_off
            - keep_warm
            - stay_on
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options:
            - upper
            - lower

set_oven_frozen_bake:
  name: Start Frozen Bake
  description: Start a Whirlpool Frozen Bake automatic oven cycle. Temperature is Celsius and cook time is minutes.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance device is selected.
      required: false
      selector:
        text:
    food:
      name: Food
      required: true
      selector:
        select:
          options:
            - pizza
            - pie
            - meals
            - fries
            - nuggets
            - lasagna
    temperature:
      name: Temperature
      description: Target temperature in Celsius.
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: °C
    cook_time_minutes:
      name: Cook time
      description: Required Frozen Bake cook time in minutes.
      required: true
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    complete_action:
      name: Complete action
      description: What the oven should do when cook time completes.
      required: false
      default: turn_off
      selector:
        select:
          options:
            - turn_off
            - keep_warm
            - stay_on
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options:
            - upper
            - lower

