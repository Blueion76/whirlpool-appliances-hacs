call_api:
  name: Call Whirlpool API
  description: Call a Whirlpool cloud API path and return the decoded response.
  fields:
    method:
      name: Method
      required: false
      example: GET
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    path:
      name: Path
      required: true
      example: /api/v1/appliance/status/SAID_HERE
      selector:
        text:
    body:
      name: Body
      required: false
      selector:
        object:
    params:
      name: Query parameters
      required: false
      selector:
        object:
    auth:
      name: Send Authorization header
      description: Turn off for endpoints that reject the normal OAuth Authorization header.
      required: false
      default: true
      selector:
        boolean:

send_appliance_command:
  name: Send appliance command
  description: Send a command through /api/v1/appliance/command.
  fields:
    appliance_device: &appliance_device_field
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said: &said_field
      name: SAID
      description: Optional manual SAID override. Not needed if appliance device is selected.
      required: false
      selector:
        text:
    command:
      name: Command
      required: false
      example: setAttributes
      selector:
        text:
    attributes:
      name: Attributes
      required: false
      selector:
        object:
    raw:
      name: Raw payload
      required: false
      selector:
        object:

set_cavity_light:
  name: Set cavity light
  description: Turn an oven or microwave cavity light on or off.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    cavity:
      name: Cavity
      required: false
      example: upper
      selector:
        text:

appliance_function:
  name: Appliance function
  description: Call a named appliance helper function from api_spec.py.
  fields:
    function:
      name: Function
      required: true
      selector:
        text:
    appliance_device: *appliance_device_field
    said: *said_field
    body:
      name: Body
      required: false
      selector:
        object:
    path_values:
      name: Path values
      required: false
      selector:
        object:

refresh:
  name: Refresh Whirlpool data
  description: Refresh appliance list and status data now.

refresh_ddm_capabilities:
  name: Refresh DDM capabilities
  description: Refresh Whirlpool Device Data Model capabilities and diagnostic errors.

update_appliances:
  name: Update appliances
  description: Call Whirlpool's appliance update endpoint and refresh integration data.
  fields:
    body:
      name: Body
      required: false
      selector:
        object:

get_ddm_content:
  name: Get DDM content
  description: Fetch Whirlpool content metadata for a Device Data Model key.
  fields:
    ddm_key:
      name: DDM key
      required: true
      selector:
        text:

publish_thing_command:
  name: Publish ThingShield MQTT command
  description: Publish a command to a ThingShield appliance over AWS IoT MQTT.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    command:
      name: Command
      required: false
      default: getState
      example: getState
      selector:
        text:
    payload:
      name: Payload
      required: false
      selector:
        object:

set_attributes:
  name: Set legacy appliance attributes
  description: Set raw legacy SAID attributes through /api/v1/appliance/command.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    attributes:
      name: Attributes
      required: true
      selector:
        object:

set_oven_cook:
  name: Start oven cook cycle
  description: Start or modify a Whirlpool legacy oven cavity cook cycle.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    temperature:
      name: Temperature
      description: Target temperature in Celsius.
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: °C
    mode:
      name: Mode
      required: false
      default: bake
      selector:
        select:
          options: [bake, convect_bake, convection_bake, broil, convect_broil, convection_broil, convect_roast, convection_roast, keep_warm, air_fry]
    cook_time_minutes:
      name: Cook time
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    delay_time_minutes:
      name: Delay time
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    complete_action:
      name: Complete action
      required: false
      default: turn_off
      selector:
        select:
          options: [turn_off, keep_warm, stay_on]
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options: [upper, lower]

set_oven_frozen_bake:
  name: Start Frozen Bake
  description: Start a Whirlpool Frozen Bake automatic oven cycle.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    food:
      name: Food
      required: true
      selector:
        select:
          options: [pizza, pie, meals, fries, nuggets, lasagna]
    temperature:
      name: Temperature
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: °C
    cook_time_minutes:
      name: Cook time
      required: true
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    complete_action:
      name: Complete action
      required: false
      default: turn_off
      selector:
        select:
          options: [turn_off, keep_warm, stay_on]
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options: [upper, lower]

stop_oven_cavity:
  name: Stop oven cavity
  description: Cancel a Whirlpool legacy oven cavity cook cycle.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options: [upper, lower]

stop_microwave:
  name: Stop microwave
  description: Cancel a Whirlpool legacy microwave operation.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field

sync_time:
  name: Sync appliance time
  description: Sync appliance time with the Whirlpool cloud time endpoint.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    timezone:
      name: Time zone
      required: false
      example: America/Chicago
      selector:
        text:

set_timezone:
  name: Set appliance time zone
  description: Write the appliance time zone attributes.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    timezone:
      name: Time zone
      required: true
      example: America/Chicago
      selector:
        text:

set_time_auto_update:
  name: Set time auto update
  description: Turn Whirlpool automatic time update on or off.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
    timezone:
      name: Time zone
      required: false
      example: America/Chicago
      selector:
        text:

set_kitchen_timer:
  name: Set kitchen timer
  description: Set and start the appliance on-screen kitchen timer.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    seconds:
      name: Seconds
      required: true
      example: 600
      selector:
        number:
          min: 0
          max: 86399
          step: 1
          unit_of_measurement: s
    timer:
      name: Timer
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 9
          step: 1

stop_kitchen_timer:
  name: Stop kitchen timer
  description: Stop or cancel the appliance on-screen kitchen timer.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    timer:
      name: Timer
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 9
          step: 1

check_firmware_update:
  name: Check firmware update
  description: Check Whirlpool cloud for firmware update availability.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field

set_quiet_mode:
  name: Set quiet mode
  description: Turn Whirlpool quiet mode on or off.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

set_remote_enable:
  name: Set remote enable
  description: Attempt to turn Whirlpool remote enable on or off.
  fields:
    appliance_device: *appliance_device_field
    said: *said_field
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

