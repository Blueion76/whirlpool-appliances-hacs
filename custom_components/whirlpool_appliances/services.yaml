sync_time:
  name: Sync appliance time
  description: Enable Whirlpool app-style automatic time update using the localizedDateAndTimeForSaids endpoint. The app uses dateTimeMode 2 for auto-update on.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    timezone:
      required: false
      example: America/Chicago
      selector:
        text:

set_time_auto_update:
  name: Set time auto update
  description: Turn Whirlpool app-style automatic time update on or off. Uses dateTimeMode 2 for on and dateTimeMode 4 for off.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    enabled:
      name: Enabled
      description: Turn this feature on or off.
      required: true
      selector:
        boolean:
    timezone:
      required: false
      example: America/Chicago
      selector:
        text:

set_kitchen_timer:
  name: Set kitchen timer
  description: Set/start the appliance on-screen kitchen timer. Whirlpool Android app sends KitchenTimer01_SetTimeSet in seconds and KitchenTimer01_SetOperations 2.
  fields:
    appliance_device:
      name: Appliance device
      description: Select the Whirlpool appliance device. The integration resolves the SAID automatically.
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said:
      name: SAID
      description: Optional manual SAID override. Not needed if appliance entity is selected.
      required: false
      selector:
        text:
    seconds:
      required: true
      example: 600
      selector:
        number:
          min: 0
          max: 86399
          step: 1
          unit_of_measurement: s
    timer:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 9
          step: 1

stop_kitchen_timer:
  name: Stop kitchen timer
  description: Stop/cancel the appliance on-screen kitchen timer.
  fields:
    appliance_device:
