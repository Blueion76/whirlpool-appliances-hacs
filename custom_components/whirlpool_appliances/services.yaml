call_api:
  name: Call Whirlpool API
  description: Call any Whirlpool cloud API path and return the decoded response.
  fields:
    method:
      name: Method
      required: false
      default: GET
      selector:
        select:
          options:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
    path:
      name: Path
      required: true
      selector:
        text: null
    body:
      name: Body
      required: false
      selector:
        object: null
    params:
      name: Query parameters
      required: false
      selector:
        object: null
    auth:
      name: Send Authorization header
      required: false
      default: true
      selector:
        boolean: null
send_appliance_command:
  name: Send appliance command
  description: Send a raw Whirlpool appliance command.
  fields:
    appliance_device: &id001
      name: Appliance device
      required: false
      selector:
        device:
          integration: whirlpool_appliances
    said: &id002
      name: SAID
      required: false
      selector:
        text: null
    command:
      name: Command
      required: false
      default: setAttributes
      selector:
        text: null
    attributes:
      name: Attributes
      required: false
      selector:
        object: null
    raw:
      name: Raw payload
      required: false
      selector:
        object: null
set_attributes:
  name: Set appliance attributes
  description: Set raw legacy SAID attributes through the Whirlpool command endpoint.
  fields:
    appliance_device: *id001
    said: *id002
    attributes:
      name: Attributes
      required: true
      selector:
        object: null
oven_control:
  name: Oven control
  description: Grouped oven action service for cooking, Frozen Bake, and stopping
    a cavity.
  fields:
    appliance_device: *id001
    said: *id002
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - set_cook
          - set_frozen_bake
          - stop
    cavity:
      name: Cavity
      required: false
      default: upper
      selector:
        select:
          options:
          - upper
          - lower
    temperature:
      name: Temperature
      required: false
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: °C
    mode:
      name: Mode
      required: false
      default: bake
      selector:
        text: null
    food:
      name: Food
      required: false
      selector:
        text: null
    cook_time_minutes:
      name: Cook time
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    delay_time_minutes:
      name: Delay time
      required: false
      selector:
        number:
          min: 0
          max: 719
          step: 1
          unit_of_measurement: min
    complete_action:
      name: Complete action
      required: false
      default: turn_off
      selector:
        select:
          options:
          - turn_off
          - keep_warm
          - stay_on
appliance_option:
  name: Appliance option
  description: Grouped appliance option service for lights, quiet/remote, timers,
    time, firmware check, and AC filter actions.
  fields:
    appliance_device: *id001
    said: *id002
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - set_cavity_light
          - set_quiet_mode
          - set_remote_enable
          - set_kitchen_timer
          - stop_kitchen_timer
          - check_firmware_update
          - sync_time
          - set_time_auto_update
          - set_timezone
          - get_ac_filter_status
          - reset_ac_filter
    enabled:
      name: Enabled
      required: false
      selector:
        boolean: null
    "on":
      name: "On"
      required: false
      selector:
        boolean: null
    cavity:
      name: Cavity
      required: false
      selector:
        text: null
    seconds:
      name: Seconds
      required: false
      selector:
        number:
          min: 0
          max: 86399
          step: 1
          unit_of_measurement: s
    timer:
      name: Timer
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 9
          step: 1
    timezone:
      name: Time zone
      required: false
      example: America/Chicago
      selector:
        text: null
    body:
      name: Body
      required: false
      selector:
        object: null
refresh:
  name: Refresh Whirlpool data
  description: Refresh status data or force-refresh DDM capabilities.
  fields:
    action:
      name: Action
      required: false
      default: status
      selector:
        select:
          options:
          - status
          - ddm_capabilities
history:
  name: History
  description: Fetch cycle or fault history.
  fields:
    appliance_device: *id001
    said: *id002
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - cycle
          - fault
    limit:
      name: Limit
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 1
    params:
      name: Query parameters
      required: false
      selector:
        object: null
favorites:
  name: Favorites
  description: Fetch or delete appliance saved/favorite cycles.
  fields:
    appliance_device: *id001
    said: *id002
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - get
          - delete
    favorite_id:
      name: Favorite ID
      required: false
      selector:
        text: null
messages:
  name: Messages
  description: Fetch or dismiss Whirlpool account message-center messages.
  fields:
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - list
          - get
          - dismiss
    message_id:
      name: Message ID
      required: false
      selector:
        text: null
feature:
  name: Feature
  description: Grouped feature service for DDM content, accessories, notifications,
    TS OTA, documents, diagnostics, and video capability discovery.
  fields:
    appliance_device: *id001
    said: *id002
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - update_appliances
          - get_ddm_content
          - get_accessories
          - get_accessory_status
          - get_accessory_cycle_history
          - get_accessory_cycle
          - get_accessory_cycle_lifecycle
          - get_accessory_favorites
          - save_accessory_cycle_favorite
          - delete_accessory_favorite
          - rename_accessory_favorite
          - update_accessory_favorite_notes
          - get_accessory_expert_cycle
          - enable_accessory_range_extender
          - get_accessory_ota_status
          - get_notification_subscriptions
          - get_notification_device
          - get_ts_ota_status
          - get_ts_ota_descriptor_status
          - get_ts_ota_descriptor
          - get_appliance_documents
          - get_thing_state
          - live_collect
          - get_video_capabilities
    params:
      name: Query parameters
      required: false
      selector:
        object: null
    body:
      name: Body
      required: false
      selector:
        object: null
    ddm_key:
      name: DDM key
      required: false
      selector:
        text: null
    serial_number:
      name: Serial number
      required: false
      selector:
        text: null
    cycle_id:
      name: Cycle ID
      required: false
      selector:
        text: null
    favorite_id:
      name: Favorite ID
      required: false
      selector:
        text: null
    favorite_name:
      name: Favorite name
      required: false
      selector:
        text: null
    notes:
      name: Notes
      required: false
      selector:
        text: null
    device_id:
      name: Device ID
      required: false
      selector:
        text: null
